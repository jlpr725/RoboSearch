<main class="workspace">
        <!-- 1. Mapa Protagonista a la izquierda (ocupa más espacio) -->
        <aside class="simulation-section">
            <h2>Estación (5x5)</h2>
            <div class="map-container">
                <div id="game-grid" class="grid-5x5"></div>
            </div>
        </aside>

        <!-- 2. Paleta de Bloques -->
        <aside class="palette">
            <h2>Bloques</h2>
            <div class="blocks-container">
                <div class="block block-mov" draggable="true" data-action="avanzar">⬆️ Avanzar</div>
                <div class="block block-mov" draggable="true" data-action="girar-der">↻ Girar Der</div>
                <div class="block block-mov" draggable="true" data-action="girar-izq">↺ Girar Izq</div>
                <div class="block block-act" draggable="true" data-action="tomar">🤏 Tomar</div>
                <div class="block block-cond" draggable="true" data-action="si-camino-libre">❓ SI libre</div>
            </div>
        </aside>

        <!-- 3. Secuencia de comandos -->
        <section class="canvas-section">
            <div class="canvas-header">
                <h2>Secuencia</h2>
                <div class="canvas-actions">
                    <button id="btn-clear" class="btn-secondary" title="Borrar">🗑️</button>
                    <button id="btn-run" class="btn-success" title="Ejecutar">▶</button>
                </div>
            </div>
            <div id="program-area" class="program-area">
                <p class="placeholder-text">Arrastra o haz clic aquí...</p>
            </div>
        </section>
    </main>
